<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org" x-data="registerForm()">
<head>
    <th:block th:include="include-new :: header-new('注册若依系统')"></th:block>
    <meta name="description" content="若依后台管理框架">
    <link rel="shortcut icon" th:href="@{favicon.ico}"/>
    <script>
        function registerForm() {
            return {
                username: '',
                password: '',
                confirmPassword: '',
                validateCode: '',
                acceptTerm: false,
                loading: false,
                error: '',
                refreshCaptcha() {
                    const img = document.querySelector('.imgcode');
                    img.src = img.src.split('?')[0] + '?t=' + new Date().getTime();
                },
                validate() {
                    if (!this.username) {
                        this.error = '请输入用户名';
                        return false;
                    }
                    if (!this.password) {
                        this.error = '请输入密码';
                        return false;
                    }
                    if (this.password !== this.confirmPassword) {
                        this.error = '两次密码输入不一致';
                        return false;
                    }
                    if (!this.acceptTerm) {
                        this.error = '请先同意使用条款';
                        return false;
                    }
                    return true;
                },
                async submit() {
                    this.error = '';
                    if (!this.validate()) return;
                    this.loading = true;
                    
                    try {
                        const formData = new FormData();
                        formData.append('username', this.username);
                        formData.append('password', this.password);
                        formData.append('validateCode', this.validateCode);
                        
                        const response = await fetch(ctx + 'register', {
                            method: 'POST',
                            body: formData,
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });
                        
                        const result = await response.json();
                        
                        if (result.code === 0) {
                            window.location.href = ctx + 'login-new';
                        } else {
                            this.error = result.msg || '注册失败';
                            this.refreshCaptcha();
                        }
                    } catch (e) {
                        this.error = '网络错误，请稍后重试';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col lg:flex-row">
        <!-- 左侧信息区域 -->
        <div class="lg:w-7/12 bg-gradient-to-br from-blue-600 to-indigo-700 p-8 lg:p-12 text-white flex flex-col justify-between">
            <div>
                <div class="mb-8">
                    <h1 class="text-3xl lg:text-4xl font-bold flex items-center gap-3">
                        <img alt="[ 若依 ]" class="h-12 lg:h-16" th:src="@{/ruoyi.png}">
                    </h1>
                </div>
                <h2 class="text-2xl lg:text-3xl font-semibold mb-6">
                    欢迎使用 <strong>若依 后台管理系统</strong>
                </h2>
                <ul class="space-y-4">
                    <li class="flex items-center gap-3 text-lg">
                        <i class="fas fa-arrow-circle-right text-yellow-300"></i>
                        <span>SpringBoot</span>
                    </li>
                    <li class="flex items-center gap-3 text-lg">
                        <i class="fas fa-arrow-circle-right text-yellow-300"></i>
                        <span>Mybatis</span>
                    </li>
                    <li class="flex items-center gap-3 text-lg">
                        <i class="fas fa-arrow-circle-right text-yellow-300"></i>
                        <span>Shiro</span>
                    </li>
                    <li class="flex items-center gap-3 text-lg">
                        <i class="fas fa-arrow-circle-right text-yellow-300"></i>
                        <span>Thymeleaf</span>
                    </li>
                    <li class="flex items-center gap-3 text-lg">
                        <i class="fas fa-arrow-circle-right text-yellow-300"></i>
                        <span>Tailwind CSS</span>
                    </li>
                </ul>
                <div class="mt-8">
                    <strong class="text-lg">已经注册过? 
                        <a th:href="@{/login-new}" class="text-yellow-300 hover:text-yellow-200 underline">直接登录&raquo;</a>
                    </strong>
                </div>
            </div>
        </div>
        
        <!-- 右侧注册表单 -->
        <div class="lg:w-5/12 p-8 lg:p-12 flex items-center">
            <div class="w-full">
                <div class="mb-8">
                    <h4 class="text-2xl font-bold text-gray-800 mb-2">注册</h4>
                    <p class="text-gray-500">你若不离不弃，我必生死相依</p>
                </div>
                
                <!-- 错误提示 -->
                <div x-show="error" x-transition class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-600 flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i>
                    <span x-text="error"></span>
                </div>
                
                <form @submit.prevent="submit" class="space-y-6">
                    <!-- 用户名 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" 
                                   x-model="username"
                                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                   placeholder="请输入用户名"
                                   maxlength="20"
                                   required />
                        </div>
                    </div>
                    
                    <!-- 密码 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" 
                                   x-model="password"
                                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                   placeholder="请输入密码"
                                   maxlength="20"
                                   required />
                        </div>
                    </div>
                    
                    <!-- 确认密码 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" 
                                   x-model="confirmPassword"
                                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                   placeholder="请输入确认密码"
                                   maxlength="20"
                                   required />
                        </div>
                    </div>
                    
                    <!-- 验证码 -->
                    <div th:if="${captchaEnabled==true}">
                        <label class="block text-sm font-medium text-gray-700 mb-2">验证码</label>
                        <div class="flex gap-4">
                            <div class="flex-1 relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fas fa-shield-alt text-gray-400"></i>
                                </div>
                                <input type="text" 
                                       x-model="validateCode"
                                       class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                       placeholder="请输入验证码"
                                       maxlength="5"
                                       required />
                            </div>
                            <div class="flex items-center">
                                <a href="javascript:void(0);" @click="refreshCaptcha" title="点击更换验证码" class="cursor-pointer">
                                    <img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode h-14 rounded-lg border border-gray-300"/>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 同意条款 -->
                    <div class="flex items-center">
                        <input type="checkbox" id="acceptTerm" x-model="acceptTerm" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="acceptTerm" class="ml-2 text-sm text-gray-600">
                            我已阅读并同意 <a href="https://gitee.com/y_project/RuoYi/blob/master/README.md" target="_blank" class="text-blue-600 hover:underline">使用条款</a>
                        </label>
                    </div>
                    
                    <!-- 注册按钮 -->
                    <button type="submit" 
                            :disabled="loading"
                            class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-3 px-4 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-800 focus:ring-4 focus:ring-blue-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <i x-show="loading" class="fas fa-spinner fa-spin"></i>
                        <span x-text="loading ? '正在验证注册，请稍候...' : '注册'"></span>
                    </button>
                </form>
                
                <!-- 版权信息 -->
                <div class="mt-12 pt-6 border-t border-gray-200 text-center text-sm text-gray-500">
                    &copy; 2018-2026 All Rights Reserved. RuoYi
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; var captchaEnabled = [[${captchaEnabled}]];</script>
    <th:block th:include="include-new :: footer-new"></th:block>
</body>
</html>
