<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="dictDataPage()">
<head>
    <th:block th:include="include-new :: header-new('字典数据列表')" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="data-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">字典名称：</label>
                    <select id="dictType" name="dictType" x-model="searchParams.dictType"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">请选择</option>
                        <option th:each="dict : ${dictList}" th:text="${dict['dictName']}" th:value="${dict['dictType']}"></option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">字典标签：</label>
                    <input type="text" name="dictLabel" x-model="searchParams.dictLabel"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">数据状态：</label>
                    <select name="status" x-model="searchParams.status"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchData()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:dict:add"
               @click="addDictData()"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                新增
            </a>
            
            <a shiro:hasPermission="system:dict:edit"
               @click="editDictData()"
               :class="{'opacity-50 cursor-not-allowed': selectedData.length !== 1}"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-edit"></i>
                修改
            </a>
            
            <a shiro:hasPermission="system:dict:remove"
               @click="deleteDictDataList()"
               :class="{'opacity-50 cursor-not-allowed': selectedData.length === 0}"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-remove"></i>
                删除
            </a>
            
            <a shiro:hasPermission="system:dict:export"
               @click="exportDictData()"
               class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-download"></i>
                导出
            </a>
            
            <a @click="closeItem()"
               class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-reply-all"></i>
                关闭
            </a>
        </div>
        
        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12">
                            <input type="checkbox" @change="toggleSelectAll($event)"
                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        </th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典编码</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典标签</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典键值</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">字典排序</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">备注</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建时间</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading">
                        <td colspan="9" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && dictData.length === 0">
                        <td colspan="9" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="data in dictData" :key="data.dictCode">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="checkbox" 
                                       :value="data.dictCode" 
                                       x-model="selectedData"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="data.dictCode"></td>
                            <td class="px-4 py-3">
                                <span :class="getBadgeClass(data.listClass, data.cssClass)" x-text="data.dictLabel"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="data.dictValue"></td>
                            <td class="px-4 py-3 text-center text-sm text-gray-600" x-text="data.dictSort"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="data.status == '0' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                                      x-text="data.status == '0' ? '正常' : '停用'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="data.remark || '-'"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="data.createTime"></td>
                            <td class="px-4 py-3 text-center">
                                <div class="flex justify-center gap-1">
                                    <button shiro:hasPermission="system:dict:edit"
                                            @click="editDictData(data.dictCode)"
                                            class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                                        <i class="fa fa-edit mr-1"></i>编辑
                                    </button>
                                    <button shiro:hasPermission="system:dict:remove"
                                            @click="deleteDictData(data.dictCode)"
                                            class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                        <i class="fa fa-remove mr-1"></i>删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                显示 <span x-text="startIndex"></span> - <span x-text="endIndex"></span> 条，共 <span x-text="total"></span> 条
            </div>
            <div class="flex gap-2">
                <button @click="prevPage()" 
                        :disabled="pageNum <= 1"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button x-for="p in visiblePages" 
                        :key="p"
                        @click="goToPage(p)"
                        :class="{'bg-blue-600 text-white': p === pageNum, 'bg-white text-gray-700 hover:bg-gray-50': p !== pageNum}"
                        class="px-3 py-1 border border-gray-300 rounded">
                    <span x-text="p"></span>
                </button>
                <button @click="nextPage()" 
                        :disabled="pageNum >= totalPages"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var prefix = ctx + "system/dict/data";
        
        function dictDataPage() {
            return {
                loading: false,
                dictData: [],
                selectedData: [],
                searchParams: {
                    dictType: '',
                    dictLabel: '',
                    status: ''
                },
                pageNum: 1,
                pageSize: 10,
                total: 0,
                
                init() {
                    this.loadDictData();
                },
                
                get totalPages() {
                    return Math.ceil(this.total / this.pageSize);
                },
                
                get visiblePages() {
                    const pages = [];
                    const start = Math.max(1, this.pageNum - 2);
                    const end = Math.min(this.totalPages, this.pageNum + 2);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    return pages;
                },
                
                get startIndex() {
                    return Math.min((this.pageNum - 1) * this.pageSize + 1, this.total);
                },
                
                get endIndex() {
                    return Math.min(this.pageNum * this.pageSize, this.total);
                },
                
                getBadgeClass(listClass, cssClass) {
                    if (cssClass) {
                        return cssClass;
                    }
                    if (!listClass || listClass === 'default') {
                        return '';
                    }
                    return 'px-2 py-0.5 text-xs rounded bg-gray-100 text-gray-800';
                },
                
                async loadDictData() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        params.append('pageNum', this.pageNum);
                        params.append('pageSize', this.pageSize);
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.dictData = data.rows || [];
                            this.total = data.total || 0;
                        }
                    } catch (error) {
                        console.error('加载字典数据失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                toggleSelectAll(event) {
                    if (event.target.checked) {
                        this.selectedData = this.dictData.map(d => d.dictCode);
                    } else {
                        this.selectedData = [];
                    }
                },
                
                searchData() {
                    this.pageNum = 1;
                    this.loadDictData();
                },
                
                resetSearch() {
                    this.searchParams = {
                        dictType: '',
                        dictLabel: '',
                        status: ''
                    };
                    this.pageNum = 1;
                    this.loadDictData();
                },
                
                addDictData() {
                    const dictType = document.getElementById('dictType').value;
                    window.location.href = prefix + '/add/' + (dictType || '');
                },
                
                editDictData(dictCode) {
                    const id = dictCode || this.selectedData[0];
                    if (!id) {
                        alert('请选择一条记录进行编辑');
                        return;
                    }
                    window.location.href = prefix + '/edit/' + id;
                },
                
                deleteDictData(dictCode) {
                    if (confirm('确认要删除该字典数据吗？')) {
                        fetch(prefix + '/remove/' + dictCode, { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('删除成功');
                                    this.loadDictData();
                                } else {
                                    alert(data.msg || '删除失败');
                                }
                            });
                    }
                },
                
                deleteDictDataList() {
                    if (this.selectedData.length === 0) {
                        alert('请选择要删除的字典数据');
                        return;
                    }
                    if (confirm(`确认要删除选中的 ${this.selectedData.length} 条字典数据吗？`)) {
                        fetch(prefix + '/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'ids=' + this.selectedData.join(',')
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('删除成功');
                                this.selectedData = [];
                                this.loadDictData();
                            } else {
                                alert(data.msg || '删除失败');
                            }
                        });
                    }
                },
                
                exportDictData() {
                    const params = new URLSearchParams();
                    Object.keys(this.searchParams).forEach(key => {
                        if (this.searchParams[key]) {
                            params.append(key, this.searchParams[key]);
                        }
                    });
                    window.location.href = prefix + '/export?' + params.toString();
                },
                
                closeItem() {
                    window.location.href = ctx + 'system/dict';
                },
                
                prevPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        this.loadDictData();
                    }
                },
                
                nextPage() {
                    if (this.pageNum < this.totalPages) {
                        this.pageNum++;
                        this.loadDictData();
                    }
                },
                
                goToPage(page) {
                    this.pageNum = page;
                    this.loadDictData();
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
