<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="dictTypePage()">
<head>
    <th:block th:include="include :: header('字典类型列表')" />
    <style>
        .drawer-panel {
            transition: transform 0.3s ease;
        }
        .drawer-panel.closed {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="type-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">字典名称：</label>
                    <input type="text" name="dictName" x-model="searchParams.dictName"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">字典类型：</label>
                    <input type="text" name="dictType" x-model="searchParams.dictType"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">字典状态：</label>
                    <select name="status" x-model="searchParams.status"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">创建时间：</label>
                    <input type="date" id="startTime" x-model="searchParams.beginTime"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <span class="text-gray-500">-</span>
                    <input type="date" id="endTime" x-model="searchParams.endTime"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchTypes()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:dict:add"
               @click="addDictType()"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                新增
            </a>
            
            <a shiro:hasPermission="system:dict:edit"
               @click="editDictType()"
               :class="{'opacity-50 cursor-not-allowed': selectedTypes.length !== 1}"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-edit"></i>
                修改
            </a>
            
            <a shiro:hasPermission="system:dict:remove"
               @click="deleteDictTypes()"
               :class="{'opacity-50 cursor-not-allowed': selectedTypes.length === 0}"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-remove"></i>
                删除
            </a>
            
            <a shiro:hasPermission="system:dict:export"
               @click="exportDictTypes()"
               class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-download"></i>
                导出
            </a>
            
            <a shiro:hasPermission="system:dict:remove"
               @click="refreshCache()"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-refresh"></i>
                刷新缓存
            </a>
        </div>
        
        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12">
                            <input type="checkbox" @change="toggleSelectAll($event)"
                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        </th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典主键</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典名称</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">字典类型</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">备注</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建时间</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading" colspan="8">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && dictTypes.length === 0" colspan="8">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="dictType in dictTypes" :key="dictType.dictId">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="checkbox" 
                                       :value="dictType.dictId" 
                                       x-model="selectedTypes"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="dictType.dictId"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="dictType.dictName"></td>
                            <td class="px-4 py-3">
                                <a @click="viewDictData(dictType)" 
                                   class="text-blue-600 hover:text-blue-800 cursor-pointer"
                                   x-text="dictType.dictType"></a>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="dictType.status == '0' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                                      x-text="dictType.status == '0' ? '正常' : '停用'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="dictType.remark || '-'"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="dictType.createTime"></td>
                            <td class="px-4 py-3 text-center">
                                <div class="flex justify-center gap-1">
                                    <button shiro:hasPermission="system:dict:edit"
                                            @click="editDictType(dictType.dictId)"
                                            class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                                        <i class="fa fa-edit mr-1"></i>编辑
                                    </button>
                                    <button shiro:hasPermission="system:dict:list"
                                            @click="detailDictData(dictType.dictId)"
                                            class="px-2 py-1 text-xs bg-info-600 text-white rounded hover:bg-info-700">
                                        <i class="fa fa-list-ul mr-1"></i>列表
                                    </button>
                                    <button shiro:hasPermission="system:dict:remove"
                                            @click="deleteDictType(dictType.dictId)"
                                            class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                        <i class="fa fa-remove mr-1"></i>删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                显示 <span x-text="startIndex"></span> - <span x-text="endIndex"></span> 条，共 <span x-text="total"></span> 条
            </div>
            <div class="flex gap-2">
                <button @click="prevPage()" 
                        :disabled="pageNum <= 1"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button x-for="p in visiblePages" 
                        :key="p"
                        @click="goToPage(p)"
                        :class="{'bg-blue-600 text-white': p === pageNum, 'bg-white text-gray-700 hover:bg-gray-50': p !== pageNum}"
                        class="px-3 py-1 border border-gray-300 rounded">
                    <span x-text="p"></span>
                </button>
                <button @click="nextPage()" 
                        :disabled="pageNum >= totalPages"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 抽屉遮罩 -->
    <div x-show="showDrawer" 
         class="fixed inset-0 bg-black bg-opacity-50 z-40"
         @click="closeDrawer"></div>
    
    <!-- 抽屉面板 -->
    <div :class="['fixed top-0 right-0 w-[800px] max-w-[95vw] h-full bg-white z-50 shadow-xl overflow-hidden flex flex-col', showDrawer ? '' : 'closed']">
        <div class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <i class="fa fa-list-ul text-blue-500"></i>
                <span class="font-semibold text-gray-800" x-text="drawerTitle"></span>
                <span class="text-sm text-gray-500 font-mono" x-text="drawerSubtitle"></span>
            </div>
            <button @click="closeDrawer" 
                    class="p-2 hover:bg-gray-200 rounded-lg transition-colors">
                <i class="fa fa-times text-gray-500"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <div x-show="drawerLoading" class="flex items-center justify-center h-32 text-gray-500">
                <i class="fa fa-spinner fa-spin text-xl mr-2"></i>
                加载中...
            </div>
            <div x-show="!drawerLoading && dictDataList.length === 0" class="text-center py-12 text-gray-500">
                <i class="fa fa-inbox text-4xl mb-4"></i>
                <p>暂无字典数据</p>
            </div>
            <div x-show="!drawerLoading && dictDataList.length > 0">
                <!-- 统计信息 -->
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-blue-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-blue-600" x-text="dictDataList.length"></div>
                        <div class="text-sm text-gray-600">共计条目</div>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-green-600" x-text="activeCount"></div>
                        <div class="text-sm text-gray-600">正常</div>
                    </div>
                    <div class="bg-red-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-red-600" x-text="disabledCount"></div>
                        <div class="text-sm text-gray-600">停用</div>
                    </div>
                </div>
                
                <!-- 数据列表 -->
                <div class="space-y-3">
                    <div x-for="data in dictDataList" :key="data.dictCode" 
                         class="border border-gray-200 rounded-lg overflow-hidden">
                        <div class="grid grid-cols-3">
                            <div class="p-3 bg-gray-50 border-r border-b border-gray-200">
                                <span class="text-xs text-gray-500">标签</span>
                            </div>
                            <div class="p-3 border-r border-b border-gray-200">
                                <span x-text="data.dictLabel"></span>
                            </div>
                            <div class="p-3 border-b border-gray-200">
                                <span :class="data.status == '0' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'" 
                                      class="px-2 py-1 text-xs rounded">
                                    <span x-text="data.status == '0' ? '正常' : '停用'"></span>
                                </span>
                            </div>
                            <div class="p-3 bg-gray-50 border-r border-gray-200">
                                <span class="text-xs text-gray-500">键值</span>
                            </div>
                            <div class="p-3 border-r border-gray-200">
                                <code class="text-sm" x-text="data.dictValue"></code>
                            </div>
                            <div class="p-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var prefix = ctx + "system/dict";
        
        function dictTypePage() {
            return {
                loading: false,
                dictTypes: [],
                selectedTypes: [],
                searchParams: {
                    dictName: '',
                    dictType: '',
                    status: '',
                    beginTime: '',
                    endTime: ''
                },
                pageNum: 1,
                pageSize: 10,
                total: 0,
                
                showDrawer: false,
                drawerLoading: false,
                drawerTitle: '',
                drawerSubtitle: '',
                dictDataList: [],
                
                init() {
                    this.loadDictTypes();
                    
                    // ESC关闭抽屉
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.showDrawer) {
                            this.closeDrawer();
                        }
                    });
                },
                
                get totalPages() {
                    return Math.ceil(this.total / this.pageSize);
                },
                
                get visiblePages() {
                    const pages = [];
                    const start = Math.max(1, this.pageNum - 2);
                    const end = Math.min(this.totalPages, this.pageNum + 2);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    return pages;
                },
                
                get startIndex() {
                    return Math.min((this.pageNum - 1) * this.pageSize + 1, this.total);
                },
                
                get endIndex() {
                    return Math.min(this.pageNum * this.pageSize, this.total);
                },
                
                get activeCount() {
                    return this.dictDataList.filter(d => d.status === '0').length;
                },
                
                get disabledCount() {
                    return this.dictDataList.filter(d => d.status === '1').length;
                },
                
                async loadDictTypes() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        params.append('pageNum', this.pageNum);
                        params.append('pageSize', this.pageSize);
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.dictTypes = data.rows || [];
                            this.total = data.total || 0;
                        }
                    } catch (error) {
                        console.error('加载字典类型失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                toggleSelectAll(event) {
                    if (event.target.checked) {
                        this.selectedTypes = this.dictTypes.map(d => d.dictId);
                    } else {
                        this.selectedTypes = [];
                    }
                },
                
                searchTypes() {
                    this.pageNum = 1;
                    this.loadDictTypes();
                },
                
                resetSearch() {
                    this.searchParams = {
                        dictName: '',
                        dictType: '',
                        status: '',
                        beginTime: '',
                        endTime: ''
                    };
                    this.pageNum = 1;
                    this.loadDictTypes();
                },
                
                addDictType() {
                    window.location.href = prefix + '/add';
                },
                
                editDictType(dictId) {
                    const id = dictId || this.selectedTypes[0];
                    if (!id) {
                        alert('请选择一条记录进行编辑');
                        return;
                    }
                    window.location.href = prefix + '/edit/' + id;
                },
                
                detailDictData(dictId) {
                    window.location.href = ctx + 'system/dict/data/index/' + dictId;
                },
                
                async viewDictData(dictType) {
                    this.drawerTitle = dictType.dictName;
                    this.drawerSubtitle = dictType.dictType;
                    this.drawerLoading = true;
                    this.showDrawer = true;
                    
                    try {
                        const response = await fetch(ctx + 'system/dict/data/list', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'dictType=' + dictType.dictType + '&pageSize=100&pageNum=1'
                        });
                        const data = await response.json();
                        this.dictDataList = data.rows || [];
                    } catch (error) {
                        this.dictDataList = [];
                    } finally {
                        this.drawerLoading = false;
                    }
                },
                
                deleteDictType(dictId) {
                    if (confirm('确认要删除该字典类型吗？')) {
                        fetch(prefix + '/remove/' + dictId, { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('删除成功');
                                    this.loadDictTypes();
                                } else {
                                    alert(data.msg || '删除失败');
                                }
                            });
                    }
                },
                
                deleteDictTypes() {
                    if (this.selectedTypes.length === 0) {
                        alert('请选择要删除的字典类型');
                        return;
                    }
                    if (confirm(`确认要删除选中的 ${this.selectedTypes.length} 条字典类型吗？`)) {
                        fetch(prefix + '/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'ids=' + this.selectedTypes.join(',')
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('删除成功');
                                this.selectedTypes = [];
                                this.loadDictTypes();
                            } else {
                                alert(data.msg || '删除失败');
                            }
                        });
                    }
                },
                
                exportDictTypes() {
                    const params = new URLSearchParams();
                    Object.keys(this.searchParams).forEach(key => {
                        if (this.searchParams[key]) {
                            params.append(key, this.searchParams[key]);
                        }
                    });
                    window.location.href = prefix + '/export?' + params.toString();
                },
                
                refreshCache() {
                    if (confirm('确认要刷新字典缓存吗？')) {
                        fetch(prefix + '/refreshCache', { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('刷新成功');
                                } else {
                                    alert(data.msg || '刷新失败');
                                }
                            });
                    }
                },
                
                closeDrawer() {
                    this.showDrawer = false;
                },
                
                prevPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        this.loadDictTypes();
                    }
                },
                
                nextPage() {
                    if (this.pageNum < this.totalPages) {
                        this.pageNum++;
                        this.loadDictTypes();
                    }
                },
                
                goToPage(page) {
                    this.pageNum = page;
                    this.loadDictTypes();
                }
            }
        }
    </script>
    
    <th:block th:include="include :: footer" />
</body>
</html>
