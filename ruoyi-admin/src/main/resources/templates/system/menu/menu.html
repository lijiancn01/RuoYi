<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="menuPage()">
<head>
    <th:block th:include="include :: header('菜单列表')" />
    <style>
        .tree-node {
            transition: all 0.2s;
        }
        .tree-node:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="menu-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">菜单名称：</label>
                    <input type="text" name="menuName" x-model="searchParams.menuName"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">菜单状态：</label>
                    <select name="visible" x-model="searchParams.visible"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option value="0">显示</option>
                        <option value="1">隐藏</option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchMenus()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:menu:add"
               @click="addMenu(0)"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                新增
            </a>
            
            <a shiro:hasPermission="system:menu:edit"
               @click="editMenu()"
               :class="{'opacity-50 cursor-not-allowed': !selectedMenu}"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-edit"></i>
                修改
            </a>
            
            <a shiro:hasPermission="system:menu:edit"
               @click="saveSort()"
               class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-sort-amount-asc"></i>
                保存排序
            </a>
            
            <a @click="toggleExpand()"
               class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-exchange"></i>
                <span x-text="expandAll ? '折叠' : '展开'"></span>
            </a>
        </div>
        
        <!-- 树形表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12"></th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700" style="width: 20%">菜单名称</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 10%">排序</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 15%">请求地址</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 10%">类型</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 10%">可见</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 15%">权限标识</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700" style="width: 20%">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading" colspan="8">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && menus.length === 0" colspan="8">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="menu in visibleMenus" :key="menu.menuId">
                        <tr class="tree-node hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="radio" 
                                       name="menuSelect" 
                                       :value="menu.menuId" 
                                       x-model="selectedMenu"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex items-center gap-2">
                                    <button @click="toggleExpandMenu(menu.menuId)" 
                                            x-show="menu.hasChildren"
                                            class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-600">
                                        <i :class="expandedMenus.includes(menu.menuId) ? 'fa fa-chevron-down' : 'fa fa-chevron-right'"></i>
                                    </button>
                                    <span x-show="!menu.hasChildren" class="w-6"></span>
                                    <i :class="menu.icon || 'fa fa-circle-o'" class="text-gray-400"></i>
                                    <span class="nav-label" x-text="menu.menuName"></span>
                                </div>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <input type="hidden" :name="'menuIds'" :value="menu.menuId">
                                <input type="text" 
                                       :name="'orderNums'" 
                                       :value="menu.orderNum"
                                       @input="updateOrderNum(menu.menuId, $event.target.value)"
                                       class="w-16 px-2 py-1 text-center border border-gray-300 rounded">
                            </td>
                            <td class="px-4 py-3 text-center text-sm text-gray-600" x-text="menu.url || '-'"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="{
                                          'bg-green-100 text-green-800': menu.menuType == 'M',
                                          'bg-blue-100 text-blue-800': menu.menuType == 'C',
                                          'bg-yellow-100 text-yellow-800': menu.menuType == 'F'
                                      }"
                                      x-text="getMenuTypeText(menu.menuType)"></span>
                            </td>
                            <td class="px-4 py-3 text-center text-sm text-gray-600" x-text="menu.menuType == 'F' ? '-' : (menu.visible == '0' ? '显示' : '隐藏')"></td>
                            <td class="px-4 py-3 text-center text-sm text-gray-600" x-text="menu.perms || '-'"></td>
                            <td class="px-4 py-3 text-center">
                                <div class="flex justify-center gap-1">
                                    <button @click="editMenu(menu.menuId)"
                                            shiro:hasPermission="system:menu:edit"
                                            class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                                        <i class="fa fa-edit mr-1"></i>编辑
                                    </button>
                                    <button @click="addMenu(menu.menuId)"
                                            shiro:hasPermission="system:menu:add"
                                            class="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">
                                        <i class="fa fa-plus mr-1"></i>新增
                                    </button>
                                    <button @click="deleteMenu(menu.menuId)"
                                            shiro:hasPermission="system:menu:remove"
                                            class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                        <i class="fa fa-trash mr-1"></i>删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
    
    <script th:inline="javascript">
        var addFlag = [[${@permission.hasPermi('system:menu:add')}]];
        var editFlag = [[${@permission.hasPermi('system:menu:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:menu:remove')}]];
        var prefix = ctx + "system/menu";
        
        function menuPage() {
            return {
                loading: false,
                menus: [],
                selectedMenu: null,
                expandAll: false,
                expandedMenus: [],
                originalOrders: {},
                currentOrders: {},
                searchParams: {
                    menuName: '',
                    visible: ''
                },
                
                init() {
                    this.loadMenus();
                },
                
                get visibleMenus() {
                    return this.buildTreeAndFilter(this.menus);
                },
                
                getMenuTypeText(type) {
                    const typeMap = {
                        'M': '目录',
                        'C': '菜单',
                        'F': '按钮'
                    };
                    return typeMap[type] || '-';
                },
                
                async loadMenus() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.menus = data.data || [];
                            // 初始化顺序
                            this.menus.forEach(menu => {
                                this.originalOrders[menu.menuId] = menu.orderNum;
                                this.currentOrders[menu.menuId] = menu.orderNum;
                            });
                            // 展开第一级
                            this.menus.filter(m => m.parentId === 0).forEach(m => {
                                this.expandedMenus.push(m.menuId);
                            });
                        }
                    } catch (error) {
                        console.error('加载菜单列表失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                buildTreeAndFilter(flatMenus) {
                    const result = [];
                    const map = {};
                    
                    flatMenus.forEach(menu => {
                        map[menu.menuId] = { ...menu, hasChildren: false };
                    });
                    
                    flatMenus.forEach(menu => {
                        if (menu.parentId === 0) {
                            result.push(map[menu.menuId]);
                        } else if (map[menu.parentId]) {
                            map[menu.parentId].hasChildren = true;
                        }
                    });
                    
                    // 展开逻辑
                    const flatResult = [];
                    const addChildren = (menu, level = 0) => {
                        menu.level = level;
                        menu.visible = true;
                        flatResult.push(menu);
                        
                        if (this.expandedMenus.includes(menu.menuId) || this.expandAll) {
                            const children = flatMenus.filter(m => m.parentId === menu.menuId);
                            children.forEach(child => {
                                addChildren(map[child.menuId], level + 1);
                            });
                        }
                    };
                    
                    result.forEach(menu => addChildren(menu));
                    return flatResult;
                },
                
                toggleExpandMenu(menuId) {
                    const index = this.expandedMenus.indexOf(menuId);
                    if (index > -1) {
                        this.expandedMenus.splice(index, 1);
                    } else {
                        this.expandedMenus.push(menuId);
                    }
                },
                
                toggleExpand() {
                    this.expandAll = !this.expandAll;
                    if (this.expandAll) {
                        this.expandedMenus = this.menus.filter(m => m.hasChildren).map(m => m.menuId);
                    } else {
                        this.expandedMenus = [];
                    }
                },
                
                updateOrderNum(menuId, value) {
                    this.currentOrders[menuId] = value;
                },
                
                searchMenus() {
                    this.loadMenus();
                },
                
                resetSearch() {
                    this.searchParams = {
                        menuName: '',
                        visible: ''
                    };
                    this.loadMenus();
                },
                
                addMenu(parentId) {
                    window.location.href = prefix + '/add/' + parentId;
                },
                
                editMenu(menuId) {
                    const id = menuId || this.selectedMenu;
                    if (!id) {
                        alert('请选择一条记录进行编辑');
                        return;
                    }
                    window.location.href = prefix + '/edit/' + id;
                },
                
                deleteMenu(menuId) {
                    if (confirm('确认要删除该菜单吗？')) {
                        fetch(prefix + '/remove/' + menuId, { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('删除成功');
                                    this.loadMenus();
                                } else {
                                    alert(data.msg || '删除失败');
                                }
                            });
                    }
                },
                
                saveSort() {
                    const changedMenuIds = [];
                    const changedOrderNums = [];
                    
                    this.menus.forEach(menu => {
                        if (this.originalOrders[menu.menuId] != this.currentOrders[menu.menuId]) {
                            changedMenuIds.push(menu.menuId);
                            changedOrderNums.push(this.currentOrders[menu.menuId]);
                        }
                    });
                    
                    if (changedMenuIds.length === 0) {
                        alert('未检测到排序修改');
                        return;
                    }
                    
                    fetch(prefix + '/updateSort', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'menuIds=' + changedMenuIds.join(',') + '&orderNums=' + changedOrderNums.join(',')
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            alert('保存排序成功');
                            this.loadMenus();
                        } else {
                            alert(data.msg || '保存排序失败');
                        }
                    });
                }
            }
        }
    </script>
    
    <th:block th:include="include :: footer" />
</body>
</html>
