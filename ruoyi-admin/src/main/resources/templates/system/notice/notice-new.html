<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="noticePage()">
<head>
    <th:block th:include="include-new :: header-new('通知公告列表')" />
    <style>
        .drawer-panel {
            transition: transform 0.3s ease;
        }
        .drawer-panel.closed {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="notice-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">公告标题：</label>
                    <input type="text" name="noticeTitle" x-model="searchParams.noticeTitle"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作人员：</label>
                    <input type="text" name="createBy" x-model="searchParams.createBy"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">公告类型：</label>
                    <select name="noticeType" x-model="searchParams.noticeType"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option th:each="dict : ${@dict.getType('sys_notice_type')}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchNotices()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:notice:add"
               @click="addNotice()"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                新增
            </a>
            
            <a shiro:hasPermission="system:notice:edit"
               @click="editNotice()"
               :class="{'opacity-50 cursor-not-allowed': selectedNotices.length !== 1}"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-edit"></i>
                修改
            </a>
            
            <a shiro:hasPermission="system:notice:remove"
               @click="deleteNotices()"
               :class="{'opacity-50 cursor-not-allowed': selectedNotices.length === 0}"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-remove"></i>
                删除
            </a>
        </div>
        
        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12">
                            <input type="checkbox" @change="toggleSelectAll($event)"
                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        </th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">序号</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">公告标题</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">公告类型</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建者</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建时间</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && notices.length === 0">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="(notice, index) in notices" :key="notice.noticeId">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="checkbox" 
                                       :value="notice.noticeId" 
                                       x-model="selectedNotices"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="index + 1 + (pageNum - 1) * pageSize"></td>
                            <td class="px-4 py-3">
                                <a @click="viewNotice(notice.noticeId)" 
                                   class="text-blue-600 hover:text-blue-800 cursor-pointer"
                                   x-text="notice.noticeTitle"></a>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span :class="getNoticeTypeClass(notice.noticeType)" 
                                      x-text="getNoticeTypeLabel(notice.noticeType)"></span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="notice.status == '0' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                                      x-text="notice.status == '0' ? '正常' : '停用'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="notice.createBy"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="notice.createTime"></td>
                            <td class="px-4 py-3 text-center">
                                <div class="flex justify-center gap-1">
                                    <button @click="showReadUsers(notice.noticeId, notice.noticeTitle)"
                                            class="px-2 py-1 text-xs bg-info-600 text-white rounded hover:bg-info-700">
                                        <i class="fa fa-eye mr-1"></i>阅读用户
                                    </button>
                                    <button shiro:hasPermission="system:notice:edit"
                                            @click="editNotice(notice.noticeId)"
                                            class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                                        <i class="fa fa-edit mr-1"></i>编辑
                                    </button>
                                    <button shiro:hasPermission="system:notice:remove"
                                            @click="deleteNotice(notice.noticeId)"
                                            class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                        <i class="fa fa-remove mr-1"></i>删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                显示 <span x-text="startIndex"></span> - <span x-text="endIndex"></span> 条，共 <span x-text="total"></span> 条
            </div>
            <div class="flex gap-2">
                <button @click="prevPage()" 
                        :disabled="pageNum <= 1"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button x-for="p in visiblePages" 
                        :key="p"
                        @click="goToPage(p)"
                        :class="{'bg-blue-600 text-white': p === pageNum, 'bg-white text-gray-700 hover:bg-gray-50': p !== pageNum}"
                        class="px-3 py-1 border border-gray-300 rounded">
                    <span x-text="p"></span>
                </button>
                <button @click="nextPage()" 
                        :disabled="pageNum >= totalPages"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 阅读用户抽屉 -->
    <div x-show="showDrawer" 
         class="fixed inset-0 bg-black bg-opacity-50 z-40"
         @click="closeDrawer"></div>
    
    <div :class="['fixed top-0 right-0 w-[800px] max-w-[95vw] h-full bg-white z-50 shadow-xl overflow-hidden flex flex-col', showDrawer ? '' : 'closed']">
        <div class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <i class="fa fa-eye text-blue-500"></i>
                <span class="font-semibold text-gray-800">「<span x-text="drawerTitle"></span>」阅读用户</span>
            </div>
            <button @click="closeDrawer" 
                    class="p-2 hover:bg-gray-200 rounded-lg transition-colors">
                <i class="fa fa-times text-gray-500"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <div x-show="drawerLoading" class="flex items-center justify-center h-32 text-gray-500">
                <i class="fa fa-spinner fa-spin text-xl mr-2"></i>
                加载中...
            </div>
            <div x-show="!drawerLoading && readUsers.length === 0" class="text-center py-12 text-gray-500">
                <i class="fa fa-inbox text-4xl mb-4"></i>
                <p>暂无阅读记录</p>
            </div>
            <div x-show="!drawerLoading && readUsers.length > 0">
                <div class="grid grid-cols-1 gap-3">
                    <div x-for="user in readUsers" :key="user.userId" 
                         class="border border-gray-200 rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="font-medium text-gray-800" x-text="user.userName"></span>
                                <span class="text-gray-500 text-sm ml-2" x-text="user.nickName"></span>
                            </div>
                            <span class="text-sm text-gray-500" x-text="user.readTime"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var prefix = ctx + "system/notice";
        var noticeTypes = [[${@dict.getType('sys_notice_type')}]];
        
        function noticePage() {
            return {
                loading: false,
                notices: [],
                selectedNotices: [],
                searchParams: {
                    noticeTitle: '',
                    createBy: '',
                    noticeType: ''
                },
                pageNum: 1,
                pageSize: 10,
                total: 0,
                
                showDrawer: false,
                drawerLoading: false,
                drawerTitle: '',
                readUsers: [],
                
                init() {
                    this.loadNotices();
                    
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.showDrawer) {
                            this.closeDrawer();
                        }
                    });
                },
                
                get totalPages() {
                    return Math.ceil(this.total / this.pageSize);
                },
                
                get visiblePages() {
                    const pages = [];
                    const start = Math.max(1, this.pageNum - 2);
                    const end = Math.min(this.totalPages, this.pageNum + 2);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    return pages;
                },
                
                get startIndex() {
                    return Math.min((this.pageNum - 1) * this.pageSize + 1, this.total);
                },
                
                get endIndex() {
                    return Math.min(this.pageNum * this.pageSize, this.total);
                },
                
                getNoticeTypeLabel(type) {
                    const dict = noticeTypes.find(d => d.dictValue === type);
                    return dict ? dict.dictLabel : type;
                },
                
                getNoticeTypeClass(type) {
                    if (type === '1') return 'px-2 py-1 text-xs rounded bg-blue-100 text-blue-800';
                    if (type === '2') return 'px-2 py-1 text-xs rounded bg-green-100 text-green-800';
                    return 'px-2 py-1 text-xs rounded bg-gray-100 text-gray-800';
                },
                
                async loadNotices() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        params.append('pageNum', this.pageNum);
                        params.append('pageSize', this.pageSize);
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.notices = data.rows || [];
                            this.total = data.total || 0;
                        }
                    } catch (error) {
                        console.error('加载公告失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                toggleSelectAll(event) {
                    if (event.target.checked) {
                        this.selectedNotices = this.notices.map(n => n.noticeId);
                    } else {
                        this.selectedNotices = [];
                    }
                },
                
                searchNotices() {
                    this.pageNum = 1;
                    this.loadNotices();
                },
                
                resetSearch() {
                    this.searchParams = {
                        noticeTitle: '',
                        createBy: '',
                        noticeType: ''
                    };
                    this.pageNum = 1;
                    this.loadNotices();
                },
                
                addNotice() {
                    window.open(prefix + '/add', '_blank');
                },
                
                viewNotice(noticeId) {
                    window.open(prefix + '/view/' + noticeId, '_blank');
                },
                
                editNotice(noticeId) {
                    const id = noticeId || this.selectedNotices[0];
                    if (!id) {
                        alert('请选择一条记录进行编辑');
                        return;
                    }
                    window.open(prefix + '/edit/' + id, '_blank');
                },
                
                deleteNotice(noticeId) {
                    if (confirm('确认要删除该公告吗？')) {
                        fetch(prefix + '/remove/' + noticeId, { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('删除成功');
                                    this.loadNotices();
                                } else {
                                    alert(data.msg || '删除失败');
                                }
                            });
                    }
                },
                
                deleteNotices() {
                    if (this.selectedNotices.length === 0) {
                        alert('请选择要删除的公告');
                        return;
                    }
                    if (confirm(`确认要删除选中的 ${this.selectedNotices.length} 条公告吗？`)) {
                        fetch(prefix + '/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'ids=' + this.selectedNotices.join(',')
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('删除成功');
                                this.selectedNotices = [];
                                this.loadNotices();
                            } else {
                                alert(data.msg || '删除失败');
                            }
                        });
                    }
                },
                
                async showReadUsers(noticeId, noticeTitle) {
                    this.drawerTitle = noticeTitle;
                    this.drawerLoading = true;
                    this.showDrawer = true;
                    
                    try {
                        const response = await fetch(prefix + '/readUsers/' + noticeId);
                        const data = await response.json();
                        this.readUsers = data.rows || [];
                    } catch (error) {
                        this.readUsers = [];
                    } finally {
                        this.drawerLoading = false;
                    }
                },
                
                closeDrawer() {
                    this.showDrawer = false;
                },
                
                prevPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        this.loadNotices();
                    }
                },
                
                nextPage() {
                    if (this.pageNum < this.totalPages) {
                        this.pageNum++;
                        this.loadNotices();
                    }
                },
                
                goToPage(page) {
                    this.pageNum = page;
                    this.loadNotices();
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
