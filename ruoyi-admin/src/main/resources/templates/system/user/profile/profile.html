<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" x-data="profilePage()">
<head>
    <th:block th:include="include :: header('用户个人信息')" />
</head>
<body class="bg-gray-100 min-h-screen">
    <input id="userId" name="userId" type="hidden" th:value="${user.userId}" />
    
    <div class="container mx-auto p-4">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- 左侧个人资料 -->
            <div class="lg:w-72">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                        <h5 class="font-semibold text-gray-800">个人资料</h5>
                    </div>
                    <div class="p-4">
                        <div class="text-center mb-4">
                            <div class="relative inline-block cursor-pointer group" @click="avatar()">
                                <img class="w-28 h-28 rounded-full object-cover mx-auto" 
                                     th:src="(${#strings.isEmpty(user.avatar)}) ? @{/img/profile.jpg} : @{${user.avatar}}" 
                                     th:onerror="'this.src=\'' + @{'/img/profile.jpg'} + '\''">
                                <div class="absolute inset-0 rounded-full bg-black bg-opacity-0 group-hover:bg-opacity-50 transition-all flex items-center justify-center">
                                    <i class="fa fa-camera text-white opacity-0 group-hover:opacity-100 transition-opacity"></i>
                                </div>
                            </div>
                            <p class="mt-2">
                                <button @click="avatar()" class="text-blue-600 hover:text-blue-800 text-sm">修改头像</button>
                            </p>
                        </div>
                        
                        <ul class="space-y-2">
                            <li class="flex items-center justify-between py-2 border-b border-gray-100">
                                <span class="flex items-center gap-2 text-gray-600">
                                    <i class="fa fa-user text-gray-400"></i>
                                    <span>登录名称</span>
                                </span>
                                <span class="text-gray-800 font-medium" x-text="user.loginName"></span>
                            </li>
                            <li class="flex items-center justify-between py-2 border-b border-gray-100">
                                <span class="flex items-center gap-2 text-gray-600">
                                    <i class="fa fa-phone text-gray-400"></i>
                                    <span>手机号码</span>
                                </span>
                                <span class="text-gray-800" x-text="user.phonenumber"></span>
                            </li>
                            <li th:if="${user.dept?.deptName != null}" class="flex items-center justify-between py-2 border-b border-gray-100">
                                <span class="flex items-center gap-2 text-gray-600">
                                    <i class="fa fa-building text-gray-400"></i>
                                    <span>所属部门</span>
                                </span>
                                <span class="text-gray-800 text-sm truncate max-w-[120px]" 
                                      th:text="${user.dept?.deptName + ' / ' + (#strings.defaultString(postGroup,'无岗位'))}"></span>
                            </li>
                            <li class="flex items-center justify-between py-2 border-b border-gray-100">
                                <span class="flex items-center gap-2 text-gray-600">
                                    <i class="fa fa-envelope-o text-gray-400"></i>
                                    <span>邮箱地址</span>
                                </span>
                                <span class="text-gray-800 text-sm truncate max-w-[120px]" th:title="${user.email}" th:text="${user.email}"></span>
                            </li>
                            <li class="flex items-center justify-between py-2">
                                <span class="flex items-center gap-2 text-gray-600">
                                    <i class="fa fa-calendar text-gray-400"></i>
                                    <span>创建时间</span>
                                </span>
                                <span class="text-gray-800" th:text="${#dates.format(user.createTime, 'yyyy-MM-dd')}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 右侧内容区 -->
            <div class="flex-1">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                        <h5 class="font-semibold text-gray-800">基本资料</h5>
                    </div>
                    <div class="p-6">
                        <!-- 标签页导航 -->
                        <div class="flex border-b border-gray-200 mb-4">
                            <button @click="activeTab = 'user_info'"
                                    :class="{'border-b-2 border-blue-600 text-blue-600': activeTab === 'user_info', 'text-gray-500 hover:text-gray-700': activeTab !== 'user_info'}"
                                    class="px-4 py-2 font-medium transition-colors">
                                基本资料
                            </button>
                            <button @click="activeTab = 'modify_password'"
                                    :class="{'border-b-2 border-blue-600 text-blue-600': activeTab === 'modify_password', 'text-gray-500 hover:text-gray-700': activeTab !== 'modify_password'}"
                                    class="px-4 py-2 font-medium transition-colors">
                                修改密码
                            </button>
                        </div>
                        
                        <!-- 基本资料表单 -->
                        <div x-show="activeTab === 'user_info'" th:object="${user}">
                            <form id="form-user-edit" class="space-y-4">
                                <input name="id" id="id" type="hidden" th:value="${user.userId}">
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">用户名称：</label>
                                    <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                           name="userName" th:field="*{userName}" placeholder="请输入用户名称">
                                </div>
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">手机号码：</label>
                                    <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                           name="phonenumber" maxlength="11" th:field="*{phonenumber}" placeholder="请输入手机号码">
                                </div>
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">邮箱：</label>
                                    <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                           name="email" maxlength="50" th:field="*{email}" placeholder="请输入邮箱">
                                </div>
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">性别：</label>
                                    <div class="flex gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" th:field="*{sex}" name="sex" value="0" 
                                                   class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                                            <span>男</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" th:field="*{sex}" name="sex" value="1" 
                                                   class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                                            <span>女</span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="flex justify-end gap-3 pt-4">
                                    <button type="button" @click="submitUserInfo()"
                                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                        <i class="fa fa-check"></i>保存
                                    </button>
                                    <button type="button" @click="closeItem()"
                                            class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2">
                                        <i class="fa fa-reply-all"></i>关闭
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- 修改密码表单 -->
                        <div x-show="activeTab === 'modify_password'">
                            <form id="form-user-resetPwd" class="space-y-4">
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">旧密码：</label>
                                    <input type="password" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                           name="oldPassword" placeholder="请输入旧密码" x-model="formData.oldPassword">
                                </div>
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">新密码：</label>
                                    <div class="flex-1">
                                        <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                               name="newPassword" id="newPassword" placeholder="请输入新密码" x-model="formData.newPassword">
                                        <th:block th:with="chrtype=${@config.getKey('sys.account.chrtype')}"> 
                                            <th:block th:if="${chrtype != '0'}">
                                                <span class="help-block m-b-none text-sm mt-1">
                                                    <th:block th:if="${chrtype == '1'}"><i class="fa fa-info-circle text-red-500"></i> 密码只能为0-9数字 </th:block>
                                                    <th:block th:if="${chrtype == '2'}"><i class="fa fa-info-circle text-red-500"></i> 密码只能为a-z和A-Z字母</th:block>
                                                    <th:block th:if="${chrtype == '3'}"><i class="fa fa-info-circle text-red-500"></i> 密码必须包含（字母，数字）</th:block>
                                                    <th:block th:if="${chrtype == '4'}"><i class="fa fa-info-circle text-red-500"></i> 密码必须包含（字母，数字，特殊字符!@#$%^&*()-=_+）</th:block>
                                                </span>
                                            </th:block>
                                        </th:block>
                                    </div>
                                </div>
                                
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                                    <label class="w-24 text-sm font-medium text-gray-700">确认密码：</label>
                                    <input type="password" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                                           name="confirmPassword" placeholder="请确认密码" x-model="formData.confirmPassword">
                                </div>
                                
                                <div class="flex justify-end gap-3 pt-4">
                                    <button type="button" @click="submitChangPassword()"
                                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                        <i class="fa fa-check"></i>保存
                                    </button>
                                    <button type="button" @click="closeItem()"
                                            class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2">
                                        <i class="fa fa-reply-all"></i>关闭
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var userId = [[${user.userId}]];
        var chrtype = [[${#strings.defaultString(@config.getKey('sys.account.chrtype'), 0)}]];
        
        function profilePage() {
            return {
                activeTab: 'user_info',
                user: {
                    loginName: [[${user.loginName}]],
                    phonenumber: [[${user.phonenumber}]],
                    email: [[${user.email}]]
                },
                formData: {
                    oldPassword: '',
                    newPassword: '',
                    confirmPassword: ''
                },
                
                avatar() {
                    var url = ctx + 'system/user/profile/avatar';
                    window.open(url, '_blank', 'width=800,height=600');
                },
                
                async submitUserInfo() {
                    const formData = new FormData(document.getElementById('form-user-edit'));
                    
                    try {
                        const response = await fetch(ctx + "system/user/profile/update", {
                            method: 'POST',
                            body: formData
                        });
                        const data = await response.json();
                        if (data.code === 0) {
                            alert('保存成功');
                        } else {
                            alert(data.msg || '保存失败');
                        }
                    } catch (error) {
                        alert('保存失败');
                    }
                },
                
                async submitChangPassword() {
                    if (!this.formData.oldPassword) {
                        alert('请输入原密码');
                        return;
                    }
                    if (!this.formData.newPassword) {
                        alert('请输入新密码');
                        return;
                    }
                    if (this.formData.newPassword.length < 6 || this.formData.newPassword.length > 20) {
                        alert('密码长度必须在6-20个字符之间');
                        return;
                    }
                    if (this.formData.newPassword !== this.formData.confirmPassword) {
                        alert('两次密码输入不一致');
                        return;
                    }
                    
                    try {
                        const response = await fetch(ctx + "system/user/profile/resetPwd", {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: `oldPassword=${encodeURIComponent(this.formData.oldPassword)}&newPassword=${encodeURIComponent(this.formData.newPassword)}&confirmPassword=${encodeURIComponent(this.formData.confirmPassword)}`
                        });
                        const data = await response.json();
                        if (data.code === 0) {
                            alert('修改成功');
                            this.formData = { oldPassword: '', newPassword: '', confirmPassword: '' };
                        } else {
                            alert(data.msg || '修改失败');
                        }
                    } catch (error) {
                        alert('修改失败');
                    }
                },
                
                closeItem() {
                    window.location.href = ctx + 'index';
                }
            }
        }
    </script>
    
    <th:block th:include="include :: footer" />
</body>
</html>
