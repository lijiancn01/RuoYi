<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="deptPage()">
<head>
    <th:block th:include="include-new :: header-new('部门列表')" />
    <style>
        .tree-node {
            transition: all 0.2s;
        }
        .tree-node:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="dept-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">部门名称：</label>
                    <input type="text" name="deptName" x-model="searchParams.deptName"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">部门状态：</label>
                    <select name="status" x-model="searchParams.status"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchDepts()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:dept:add"
               @click="addDept(100)"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                新增
            </a>
            
            <a shiro:hasPermission="system:dept:edit"
               @click="editDept()"
               :class="{'opacity-50 cursor-not-allowed': !selectedDept}"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-edit"></i>
                修改
            </a>
            
            <a shiro:hasPermission="system:dept:edit"
               @click="saveSort()"
               class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-sort-amount-asc"></i>
                保存排序
            </a>
            
            <a @click="toggleExpand()"
               class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-exchange"></i>
                <span x-text="expandAll ? '折叠' : '展开'"></span>
            </a>
        </div>
        
        <!-- 树形表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12"></th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">部门名称</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">排序</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建时间</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading" colspan="6">
                        <td colspan="6" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && depts.length === 0" colspan="6">
                        <td colspan="6" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="dept in visibleDepts" :key="dept.deptId">
                        <tr class="tree-node hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="radio" 
                                       name="deptSelect" 
                                       :value="dept.deptId" 
                                       x-model="selectedDept"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex items-center gap-2">
                                    <button @click="toggleExpandDept(dept.deptId)" 
                                            x-show="dept.hasChildren"
                                            class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-gray-600">
                                        <i :class="expandedDepts.includes(dept.deptId) ? 'fa fa-chevron-down' : 'fa fa-chevron-right'"></i>
                                    </button>
                                    <span x-show="!dept.hasChildren" class="w-6"></span>
                                    <i class="fa fa-building text-gray-400"></i>
                                    <span class="nav-label" x-text="dept.deptName"></span>
                                </div>
                            </td>
                            <td class="px-4 py-3">
                                <input type="hidden" :name="'deptIds'" :value="dept.deptId">
                                <input type="text" 
                                       :name="'orderNums'" 
                                       :value="dept.orderNum"
                                       @input="updateOrderNum(dept.deptId, $event.target.value)"
                                       class="w-16 px-2 py-1 text-center border border-gray-300 rounded">
                            </td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="dept.status == '0' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'"
                                      x-text="dept.status == '0' ? '正常' : '停用'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="dept.createTime"></td>
                            <td class="px-4 py-3">
                                <template x-if="dept.parentId != 0">
                                    <div class="flex gap-1">
                                        <button @click="editDept(dept.deptId)"
                                                shiro:hasPermission="system:dept:edit"
                                                class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                                            <i class="fa fa-edit mr-1"></i>编辑
                                        </button>
                                        <button @click="addDept(dept.deptId)"
                                                shiro:hasPermission="system:dept:add"
                                                class="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">
                                            <i class="fa fa-plus mr-1"></i>新增
                                        </button>
                                        <button @click="deleteDept(dept.deptId)"
                                                shiro:hasPermission="system:dept:remove"
                                                class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                            <i class="fa fa-trash mr-1"></i>删除
                                        </button>
                                    </div>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
    
    <script th:inline="javascript">
        var addFlag = [[${@permission.hasPermi('system:dept:add')}]];
        var editFlag = [[${@permission.hasPermi('system:dept:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:dept:remove')}]];
        var prefix = ctx + "system/dept";
        
        function deptPage() {
            return {
                loading: false,
                depts: [],
                selectedDept: null,
                expandAll: false,
                expandedDepts: [],
                originalOrders: {},
                currentOrders: {},
                searchParams: {
                    deptName: '',
                    status: ''
                },
                
                init() {
                    this.loadDepts();
                },
                
                get visibleDepts() {
                    return this.buildTreeAndFilter(this.depts);
                },
                
                async loadDepts() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.depts = data.data || [];
                            // 初始化顺序
                            this.depts.forEach(dept => {
                                this.originalOrders[dept.deptId] = dept.orderNum;
                                this.currentOrders[dept.deptId] = dept.orderNum;
                            });
                            // 展开第一级
                            this.depts.filter(d => d.parentId === 0).forEach(d => {
                                this.expandedDepts.push(d.deptId);
                            });
                        }
                    } catch (error) {
                        console.error('加载部门列表失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                buildTreeAndFilter(flatDepts) {
                    const result = [];
                    const map = {};
                    
                    flatDepts.forEach(dept => {
                        map[dept.deptId] = { ...dept, hasChildren: false };
                    });
                    
                    flatDepts.forEach(dept => {
                        if (dept.parentId === 0) {
                            result.push(map[dept.deptId]);
                        } else if (map[dept.parentId]) {
                            map[dept.parentId].hasChildren = true;
                        }
                    });
                    
                    // 展开逻辑
                    const flatResult = [];
                    const addChildren = (dept, level = 0) => {
                        dept.level = level;
                        dept.visible = true;
                        flatResult.push(dept);
                        
                        if (this.expandedDepts.includes(dept.deptId) || this.expandAll) {
                            const children = flatDepts.filter(d => d.parentId === dept.deptId);
                            children.forEach(child => {
                                addChildren(map[child.deptId], level + 1);
                            });
                        }
                    };
                    
                    result.forEach(dept => addChildren(dept));
                    return flatResult;
                },
                
                toggleExpandDept(deptId) {
                    const index = this.expandedDepts.indexOf(deptId);
                    if (index > -1) {
                        this.expandedDepts.splice(index, 1);
                    } else {
                        this.expandedDepts.push(deptId);
                    }
                },
                
                toggleExpand() {
                    this.expandAll = !this.expandAll;
                    if (this.expandAll) {
                        this.expandedDepts = this.depts.filter(d => d.hasChildren).map(d => d.deptId);
                    } else {
                        this.expandedDepts = [];
                    }
                },
                
                updateOrderNum(deptId, value) {
                    this.currentOrders[deptId] = value;
                },
                
                searchDepts() {
                    this.loadDepts();
                },
                
                resetSearch() {
                    this.searchParams = {
                        deptName: '',
                        status: ''
                    };
                    this.loadDepts();
                },
                
                addDept(parentId) {
                    window.location.href = prefix + '/add/' + parentId;
                },
                
                editDept(deptId) {
                    const id = deptId || this.selectedDept;
                    if (!id) {
                        alert('请选择一条记录进行编辑');
                        return;
                    }
                    window.location.href = prefix + '/edit/' + id;
                },
                
                deleteDept(deptId) {
                    if (confirm('确认要删除该部门吗？')) {
                        fetch(prefix + '/remove/' + deptId, { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('删除成功');
                                    this.loadDepts();
                                } else {
                                    alert(data.msg || '删除失败');
                                }
                            });
                    }
                },
                
                saveSort() {
                    const changedDeptIds = [];
                    const changedOrderNums = [];
                    
                    this.depts.forEach(dept => {
                        if (String(this.originalOrders[dept.deptId]) != String(this.currentOrders[dept.deptId])) {
                            changedDeptIds.push(dept.deptId);
                            changedOrderNums.push(this.currentOrders[dept.deptId]);
                        }
                    });
                    
                    if (changedDeptIds.length === 0) {
                        alert('未检测到排序修改');
                        return;
                    }
                    
                    fetch(prefix + '/updateSort', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'deptIds=' + changedDeptIds.join(',') + '&orderNums=' + changedOrderNums.join(',')
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            alert('保存排序成功');
                            this.loadDepts();
                        } else {
                            alert(data.msg || '保存排序失败');
                        }
                    });
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
