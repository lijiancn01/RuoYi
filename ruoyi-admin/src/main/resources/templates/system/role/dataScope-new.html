<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" x-data="dataScopePage()">
<head>
    <th:block th:include="include-new :: header-new('角色数据权限')" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 max-w-2xl">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                <h5 class="font-semibold text-gray-800">角色数据权限</h5>
            </div>
            
            <form id="form-role-edit" th:object="${role}" class="p-6 space-y-4">
                <input id="roleId" name="roleId" type="hidden" th:field="*{roleId}"/>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">角色名称：</label>
                    <input class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50" 
                           type="text" name="roleName" id="roleName" th:field="*{roleName}" readonly>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">权限字符：</label>
                    <input class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50" 
                           type="text" name="roleKey" id="roleKey" th:field="*{roleKey}" readonly>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">数据范围：</label>
                    <select id="dataScope" name="dataScope" x-model="dataScope"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="1">全部数据权限</option>
                        <option value="2">自定义数据权限</option>
                        <option value="3">本部门数据权限</option>
                        <option value="4">本部门及以下数据权限</option>
                        <option value="5">仅本人数据权限</option>
                    </select>
                    <p class="mt-1 text-sm text-gray-500">
                        <i class="fa fa-info-circle text-blue-500"></i> 特殊情况下，设置为"自定义数据权限"
                    </p>
                </div>
                
                <!-- 数据权限树（自定义数据范围时显示） -->
                <div x-show="dataScope == '2'" class="mt-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="flex flex-wrap gap-4 mb-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" @change="toggleExpandAll($event)" x-model="expandAll"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">展开/折叠</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" @change="toggleCheckAll($event)" x-model="checkAll"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">全选/全不选</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" @change="toggleCascade($event)" x-model="cascade"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">父子联动</span>
                            </label>
                        </div>
                        
                        <div class="border border-gray-200 rounded-lg p-4 max-h-[300px] overflow-y-auto">
                            <div x-show="deptLoading" class="text-center py-8 text-gray-500">
                                <i class="fas fa-spinner fa-spin text-xl"></i>
                                加载部门树...
                            </div>
                            <div x-show="!deptLoading" id="deptTrees" class="space-y-1">
                                <template x-for="dept in deptTree" :key="dept.deptId">
                                    <div class="dept-item">
                                        <div class="flex items-center gap-2 py-1 hover:bg-gray-100 rounded px-2"
                                             :style="{'padding-left': (dept.level * 20 + 8) + 'px'}">
                                            <button type="button" @click="toggleDept(dept)" 
                                                    class="text-gray-400 hover:text-gray-600 w-5 h-5 flex items-center justify-center">
                                                <i :class="dept.expanded ? 'fa fa-minus-square-o' : 'fa fa-plus-square-o'"></i>
                                            </button>
                                            <input type="checkbox" :value="dept.deptId" x-model="selectedDepts"
                                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                                   @change="checkCascade(dept)">
                                            <span class="text-sm" x-text="dept.deptName"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
                <button type="button" @click="submitHandler()"
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                    <i class="fa fa-check"></i>
                    确定
                </button>
                <button type="button" @click="closeItem()"
                        class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2">
                    <i class="fa fa-close"></i>
                    取消
                </button>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var roleId = [[${role.roleId}]];
        var roleDataScope = [[${role.dataScope}]];
        
        function dataScopePage() {
            return {
                dataScope: roleDataScope || '1',
                deptLoading: false,
                deptTree: [],
                selectedDepts: [],
                expandAll: true,
                checkAll: false,
                cascade: true,
                
                init() {
                    if (this.dataScope == '2') {
                        this.loadDeptTree();
                    }
                },
                
                async loadDeptTree() {
                    this.deptLoading = true;
                    try {
                        const response = await fetch(ctx + 'system/role/deptTreeData?roleId=' + roleId);
                        const data = await response.json();
                        if (data.code === 0) {
                            this.buildDeptTree(data.depts || []);
                        }
                    } catch (error) {
                        console.error('加载部门树失败:', error);
                    } finally {
                        this.deptLoading = false;
                    }
                },
                
                buildDeptTree(depts, parentId = 0, level = 0) {
                    const children = parentId === 0 
                        ? dept.filter(d => !d.parentId || d.parentId === 0) 
                        : dept.filter(d => d.parentId === parentId);
                    
                    children.forEach(dept => {
                        this.deptTree.push({
                            ...dept,
                            level: level,
                            expanded: level < 2
                        });
                        if (this.deptTree.find(d => d.deptId === dept.deptId).expanded) {
                            this.buildDeptTree(depts, dept.deptId, level + 1);
                        }
                    });
                },
                
                toggleDept(dept) {
                    dept.expanded = !dept.expanded;
                    this.loadDeptTree();
                },
                
                toggleExpandAll(event) {
                    this.expandAll = event.target.checked;
                },
                
                toggleCheckAll(event) {
                    this.checkAll = event.target.checked;
                    if (this.checkAll) {
                        this.selectedDepts = this.deptTree.map(d => d.deptId);
                    } else {
                        this.selectedDepts = [];
                    }
                },
                
                toggleCascade(event) {
                    this.cascade = event.target.checked;
                },
                
                checkCascade(dept) {
                    if (this.cascade) {
                        this.selectChildren(dept.deptId);
                    }
                },
                
                selectChildren(parentId) {
                    this.deptTree.forEach(dept => {
                        if (dept.parentId === parentId && !this.selectedDepts.includes(dept.deptId)) {
                            this.selectedDepts.push(dept.deptId);
                            this.selectChildren(dept.deptId);
                        }
                    });
                },
                
                submitHandler() {
                    const roleName = document.getElementById('roleName').value;
                    const roleKey = document.getElementById('roleKey').value;
                    
                    fetch(ctx + 'system/role/authDataScope', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'roleId=' + roleId + '&roleName=' + encodeURIComponent(roleName) + 
                              '&roleKey=' + encodeURIComponent(roleKey) + '&dataScope=' + this.dataScope +
                              '&deptIds=' + this.selectedDepts.join(',')
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.code === 0) {
                            alert('保存成功');
                            window.close();
                        } else {
                            alert(data.msg || '保存失败');
                        }
                    });
                },
                
                closeItem() {
                    window.close();
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
