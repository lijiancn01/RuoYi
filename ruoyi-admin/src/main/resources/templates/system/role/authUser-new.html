<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="authUserPage()">
<head>
    <th:block th:include="include-new :: header-new('角色分配用户')" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <input type="hidden" id="roleId" name="roleId" th:value="${role.roleId}">
        
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="role-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">登录名称：</label>
                    <input type="text" name="loginName" x-model="searchParams.loginName"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">手机号码：</label>
                    <input type="text" name="phonenumber" x-model="searchParams.phonenumber"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchUsers()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="system:role:add"
               @click="selectUser()"
               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-plus"></i>
                添加用户
            </a>
            
            <button shiro:hasPermission="system:role:remove"
                    @click="cancelAuthUserAll()"
                    :class="{'opacity-50 cursor-not-allowed': selectedUsers.length === 0}"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2">
                <i class="fa fa-remove"></i>
                批量取消授权
            </button>
            
            <button @click="closeItem()"
                    class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2">
                <i class="fa fa-reply-all"></i>
                关闭
            </button>
        </div>
        
        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12">
                            <input type="checkbox" @change="toggleSelectAll($event)"
                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        </th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">登录名称</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">用户名称</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">邮箱</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">手机</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">用户状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">创建时间</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && users.length === 0">
                        <td colspan="8" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="user in users" :key="user.userId">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="checkbox" 
                                       :value="user.userId" 
                                       x-model="selectedUsers"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="user.loginName"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="user.userName"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="user.email"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="user.phonenumber"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="user.status == '0' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                                      x-text="user.status == '0' ? '正常' : '停用'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="user.createTime"></td>
                            <td class="px-4 py-3 text-center">
                                <button shiro:hasPermission="system:role:remove"
                                        @click="cancelAuthUser(user.userId)"
                                        class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                                    <i class="fa fa-remove mr-1"></i>取消授权
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                显示 <span x-text="startIndex"></span> - <span x-text="endIndex"></span> 条，共 <span x-text="total"></span> 条
            </div>
            <div class="flex gap-2">
                <button @click="prevPage()" 
                        :disabled="pageNum <= 1"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button x-for="p in visiblePages" 
                        :key="p"
                        @click="goToPage(p)"
                        :class="{'bg-blue-600 text-white': p === pageNum, 'bg-white text-gray-700 hover:bg-gray-50': p !== pageNum}"
                        class="px-3 py-1 border border-gray-300 rounded">
                    <span x-text="p"></span>
                </button>
                <button @click="nextPage()" 
                        :disabled="pageNum >= totalPages"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var prefix = ctx + "system/role/authUser";
        var roleId = [[${role.roleId}]];
        
        function authUserPage() {
            return {
                loading: false,
                users: [],
                selectedUsers: [],
                searchParams: {
                    loginName: '',
                    phonenumber: ''
                },
                pageNum: 1,
                pageSize: 10,
                total: 0,
                
                init() {
                    this.loadUsers();
                },
                
                get totalPages() {
                    return Math.ceil(this.total / this.pageSize);
                },
                
                get visiblePages() {
                    const pages = [];
                    const start = Math.max(1, this.pageNum - 2);
                    const end = Math.min(this.totalPages, this.pageNum + 2);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    return pages;
                },
                
                get startIndex() {
                    return Math.min((this.pageNum - 1) * this.pageSize + 1, this.total);
                },
                
                get endIndex() {
                    return Math.min(this.pageNum * this.pageSize, this.total);
                },
                
                async loadUsers() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        params.append('roleId', roleId);
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        params.append('pageNum', this.pageNum);
                        params.append('pageSize', this.pageSize);
                        
                        const response = await fetch(prefix + '/allocatedList?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.users = data.rows || [];
                            this.total = data.total || 0;
                        }
                    } catch (error) {
                        console.error('加载用户失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                toggleSelectAll(event) {
                    if (event.target.checked) {
                        this.selectedUsers = this.users.map(u => u.userId);
                    } else {
                        this.selectedUsers = [];
                    }
                },
                
                searchUsers() {
                    this.pageNum = 1;
                    this.loadUsers();
                },
                
                resetSearch() {
                    this.searchParams = {
                        loginName: '',
                        phonenumber: ''
                    };
                    this.pageNum = 1;
                    this.loadUsers();
                },
                
                selectUser() {
                    window.location.href = prefix + '/selectUser/' + roleId;
                },
                
                cancelAuthUser(userId) {
                    if (confirm('确认要取消该用户角色吗？')) {
                        fetch(prefix + '/cancel', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'roleId=' + roleId + '&userId=' + userId
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('取消授权成功');
                                this.loadUsers();
                            } else {
                                alert(data.msg || '取消授权失败');
                            }
                        });
                    }
                },
                
                cancelAuthUserAll() {
                    if (this.selectedUsers.length === 0) {
                        alert('请至少选择一条记录');
                        return;
                    }
                    if (confirm('确认要删除选中的 ' + this.selectedUsers.length + ' 条数据吗？')) {
                        fetch(prefix + '/cancelAll', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'roleId=' + roleId + '&userIds=' + this.selectedUsers.join(',')
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('批量取消授权成功');
                                this.selectedUsers = [];
                                this.loadUsers();
                            } else {
                                alert(data.msg || '批量取消授权失败');
                            }
                        });
                    }
                },
                
                closeItem() {
                    window.location.href = ctx + 'system/role';
                },
                
                prevPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        this.loadUsers();
                    }
                },
                
                nextPage() {
                    if (this.pageNum < this.totalPages) {
                        this.pageNum++;
                        this.loadUsers();
                    }
                },
                
                goToPage(page) {
                    this.pageNum = page;
                    this.loadUsers();
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
