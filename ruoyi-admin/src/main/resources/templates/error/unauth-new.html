<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuoYi - 403 无权限</title>
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center">
    <div class="text-center">
        <div class="bg-white rounded-2xl shadow-xl p-12 max-w-lg mx-auto">
            <div class="text-8xl font-bold text-red-500 mb-4">403</div>
            <div class="text-2xl font-bold text-gray-800 mb-4">您没有访问权限！</div>
            <div class="text-gray-600 mb-8">
                对不起，您没有访问权限，请不要进行非法操作！您可以返回主页面
            </div>
            <button onclick="goHome()" 
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors inline-flex items-center gap-2">
                <i class="fa fa-home"></i>
                返回主页
            </button>
        </div>
    </div>
    
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        function goHome() {
            window.top.location = ctx + "index";
        }
    </script>
</body>
</html>
