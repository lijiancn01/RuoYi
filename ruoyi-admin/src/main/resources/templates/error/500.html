<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org" x-data="errorPage()">
<head>
    <th:block th:include="include :: header('若依系统 500')"></th:block>
    <link rel="shortcut icon" th:href="@{favicon.ico}"/>
    <script>
        function errorPage() {
            return {
                countdown: 5,
                init() {
                    setInterval(() => {
                        if (this.countdown > 0) {
                            this.countdown--;
                            if (this.countdown === 0) {
                                window.location.href = '/';
                            }
                        }
                    }, 1000);
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center">
        <div class="mb-6">
            <h1 class="text-8xl font-black text-red-600 mb-2">500</h1>
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">服务器内部错误</h2>
            <p class="text-gray-500 mb-8">
                抱歉，服务器出现了内部错误。请稍后再试或联系管理员。
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center mb-6">
                <a 
                    th:href="@{/}"
                    class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-lg font-medium hover:from-blue-700 hover:to-indigo-800 transition-all"
                >
                    <i class="fas fa-home"></i>
                    返回首页
                </a>
                <a 
                    href="javascript:history.back()"
                    class="inline-flex items-center justify-center gap-2 px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-all"
                >
                    <i class="fas fa-arrow-left"></i>
                    返回上页
                </a>
            </div>
            
            <div class="pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-500">
                    系统将在 <span x-text="countdown" class="text-blue-600 font-semibold">5</span> 秒后自动跳转到首页
                </p>
            </div>
        </div>
    </div>
    
    <th:block th:include="include :: footer"></th:block>
</body>
</html>
