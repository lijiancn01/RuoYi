<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro" x-data="operlogPage()">
<head>
    <th:block th:include="include-new :: header-new('操作日志列表')" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <!-- 搜索栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
            <form id="operlog-form" class="flex flex-wrap gap-4 items-end">
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作地址：</label>
                    <input type="text" name="operIp" x-model="searchParams.operIp"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">系统模块：</label>
                    <input type="text" name="title" x-model="searchParams.title"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作人员：</label>
                    <input type="text" name="operName" x-model="searchParams.operName"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作类型：</label>
                    <select name="businessTypes" x-model="searchParams.businessTypes"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">请选择</option>
                        <option value="0">新增</option>
                        <option value="1">修改</option>
                        <option value="2">删除</option>
                        <option value="3">查询</option>
                        <option value="4">导出</option>
                        <option value="5">导入</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作状态：</label>
                    <select name="status" x-model="searchParams.status"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">所有</option>
                        <option value="0">成功</option>
                        <option value="1">失败</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="text-gray-700 font-medium">操作时间：</label>
                    <input type="date" id="startTime" x-model="searchParams.beginTime"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <span class="text-gray-500">-</span>
                    <input type="date" id="endTime" x-model="searchParams.endTime"
                           class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex gap-2">
                    <button type="button" @click="searchOperlog()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fa fa-search"></i>
                        搜索
                    </button>
                    <button type="button" @click="resetSearch()"
                            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
                        <i class="fa fa-refresh"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 工具栏 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-2">
            <a shiro:hasPermission="monitor:operlog:remove"
               @click="deleteOperlogs()"
               :class="{'opacity-50 cursor-not-allowed': selectedIds.length === 0}"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-remove"></i>
                删除
            </a>
            
            <a shiro:hasPermission="monitor:operlog:remove"
               @click="cleanOperlog()"
               class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-trash"></i>
                清空
            </a>
            
            <a shiro:hasPermission="monitor:operlog:export"
               @click="exportOperlog()"
               class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 flex items-center gap-2 cursor-pointer">
                <i class="fa fa-download"></i>
                导出
            </a>
        </div>
        
        <!-- 数据表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left w-12">
                            <input type="checkbox" @change="toggleSelectAll($event)"
                                   class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        </th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">日志编号</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">系统模块</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作类型</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">操作人员</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">部门名称</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">操作地址</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">操作地点</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作状态</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">操作时间</th>
                        <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">消耗时间</th>
                        <th class="px-4 py-3 text-center text-sm font-semibold text-gray-700">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr x-show="loading" colspan="12">
                        <td colspan="12" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                    <tr x-show="!loading && operlogs.length === 0" colspan="12">
                        <td colspan="12" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                    <template x-for="operlog in operlogs" :key="operlog.operId">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3">
                                <input type="checkbox" 
                                       :value="operlog.operId" 
                                       x-model="selectedIds"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.operId"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.title"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="getBusinessTypeClass(operlog.businessType)"
                                      x-text="getBusinessTypeText(operlog.businessType)"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.operName"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.deptName || '-'"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.operIp"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.operLocation"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs rounded" 
                                      :class="operlog.status == '0' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                                      x-text="operlog.status == '0' ? '成功' : '失败'"></span>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.operTime"></td>
                            <td class="px-4 py-3 text-sm text-gray-600" x-text="operlog.costTime + '毫秒'"></td>
                            <td class="px-4 py-3 text-center">
                                <button shiro:hasPermission="monitor:operlog:detail"
                                        @click="viewDetail(operlog.operId)"
                                        class="px-2 py-1 text-xs bg-yellow-600 text-white rounded hover:bg-yellow-700">
                                    <i class="fa fa-search mr-1"></i>详细
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="mt-4 bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex items-center justify-between">
            <div class="text-sm text-gray-600">
                显示 <span x-text="startIndex"></span> - <span x-text="endIndex"></span> 条，共 <span x-text="total"></span> 条
            </div>
            <div class="flex gap-2">
                <button @click="prevPage()" 
                        :disabled="pageNum <= 1"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button x-for="p in visiblePages" 
                        :key="p"
                        @click="goToPage(p)"
                        :class="{'bg-blue-600 text-white': p === pageNum, 'bg-white text-gray-700 hover:bg-gray-50': p !== pageNum}"
                        class="px-3 py-1 border border-gray-300 rounded">
                    <span x-text="p"></span>
                </button>
                <button @click="nextPage()" 
                        :disabled="pageNum >= totalPages"
                        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div x-show="showDetail" 
         x-transition
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
         @click.outside="showDetail = false">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-2xl max-h-[80vh] overflow-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-800">操作日志详情</h3>
                <button @click="showDetail = false" class="p-2 hover:bg-gray-100 rounded-lg">
                    <i class="fa fa-times text-gray-500"></i>
                </button>
            </div>
            <div x-if="detailData" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">操作模块</div>
                        <div class="text-lg font-semibold text-gray-800" x-text="detailData.title"></div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">操作类型</div>
                        <div class="text-lg font-semibold" :class="getBusinessTypeClass(detailData.businessType)">
                            <span x-text="getBusinessTypeText(detailData.businessType)"></span>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">操作人员</div>
                        <div class="text-lg font-semibold text-gray-800" x-text="detailData.operName"></div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">操作时间</div>
                        <div class="text-lg font-semibold text-gray-800" x-text="detailData.operTime"></div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">操作状态</div>
                        <div class="text-lg font-semibold" :class="detailData.status == '0' ? 'text-green-600' : 'text-red-600'">
                            <span x-text="detailData.status == '0' ? '成功' : '失败'"></span>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="text-sm text-gray-500">消耗时间</div>
                        <div class="text-lg font-semibold text-gray-800" x-text="detailData.costTime + '毫秒'"></div>
                    </div>
                </div>
                <div class="bg-gray-50 rounded-lg p-4">
                    <div class="text-sm text-gray-500">请求参数</div>
                    <div class="text-sm font-medium text-gray-800 mt-2" x-text="detailData.operParam || '-'"></div>
                </div>
                <div class="bg-gray-50 rounded-lg p-4">
                    <div class="text-sm text-gray-500">返回结果</div>
                    <div class="text-sm font-medium text-gray-800 mt-2" x-text="detailData.jsonResult || '-'"></div>
                </div>
                <div class="bg-gray-50 rounded-lg p-4">
                    <div class="text-sm text-gray-500">错误信息</div>
                    <div class="text-sm font-medium text-red-600 mt-2" x-text="detailData.errorMsg || '-'"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        var prefix = ctx + "monitor/operlog";
        
        function operlogPage() {
            return {
                loading: false,
                operlogs: [],
                selectedIds: [],
                searchParams: {
                    operIp: '',
                    title: '',
                    operName: '',
                    businessTypes: '',
                    status: '',
                    beginTime: '',
                    endTime: ''
                },
                pageNum: 1,
                pageSize: 10,
                total: 0,
                showDetail: false,
                detailData: null,
                
                init() {
                    this.loadOperlogs();
                },
                
                get totalPages() {
                    return Math.ceil(this.total / this.pageSize);
                },
                
                get visiblePages() {
                    const pages = [];
                    const start = Math.max(1, this.pageNum - 2);
                    const end = Math.min(this.totalPages, this.pageNum + 2);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    return pages;
                },
                
                get startIndex() {
                    return Math.min((this.pageNum - 1) * this.pageSize + 1, this.total);
                },
                
                get endIndex() {
                    return Math.min(this.pageNum * this.pageSize, this.total);
                },
                
                getBusinessTypeText(type) {
                    const typeMap = {
                        '0': '新增',
                        '1': '修改',
                        '2': '删除',
                        '3': '查询',
                        '4': '导出',
                        '5': '导入'
                    };
                    return typeMap[type] || '-';
                },
                
                getBusinessTypeClass(type) {
                    const classMap = {
                        '0': 'bg-green-100 text-green-800',
                        '1': 'bg-blue-100 text-blue-800',
                        '2': 'bg-red-100 text-red-800',
                        '3': 'bg-gray-100 text-gray-800',
                        '4': 'bg-yellow-100 text-yellow-800',
                        '5': 'bg-purple-100 text-purple-800'
                    };
                    return classMap[type] || 'bg-gray-100 text-gray-800';
                },
                
                async loadOperlogs() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams();
                        Object.keys(this.searchParams).forEach(key => {
                            if (this.searchParams[key]) {
                                params.append(key, this.searchParams[key]);
                            }
                        });
                        params.append('pageNum', this.pageNum);
                        params.append('pageSize', this.pageSize);
                        
                        const response = await fetch(prefix + '/list?' + params.toString());
                        const data = await response.json();
                        if (data.code === 0) {
                            this.operlogs = data.rows || [];
                            this.total = data.total || 0;
                        }
                    } catch (error) {
                        console.error('加载操作日志失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                toggleSelectAll(event) {
                    if (event.target.checked) {
                        this.selectedIds = this.operlogs.map(o => o.operId);
                    } else {
                        this.selectedIds = [];
                    }
                },
                
                searchOperlog() {
                    this.pageNum = 1;
                    this.loadOperlogs();
                },
                
                resetSearch() {
                    this.searchParams = {
                        operIp: '',
                        title: '',
                        operName: '',
                        businessTypes: '',
                        status: '',
                        beginTime: '',
                        endTime: ''
                    };
                    this.pageNum = 1;
                    this.loadOperlogs();
                },
                
                async viewDetail(operId) {
                    try {
                        const response = await fetch(prefix + '/detail/' + operId);
                        const data = await response.json();
                        if (data.code === 0) {
                            this.detailData = data.data;
                            this.showDetail = true;
                        }
                    } catch (error) {
                        console.error('获取详情失败:', error);
                    }
                },
                
                deleteOperlogs() {
                    if (this.selectedIds.length === 0) {
                        alert('请选择要删除的记录');
                        return;
                    }
                    if (confirm(`确认要删除选中的 ${this.selectedIds.length} 条记录吗？`)) {
                        fetch(prefix + '/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'ids=' + this.selectedIds.join(',')
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 0) {
                                alert('删除成功');
                                this.selectedIds = [];
                                this.loadOperlogs();
                            } else {
                                alert(data.msg || '删除失败');
                            }
                        });
                    }
                },
                
                cleanOperlog() {
                    if (confirm('确认要清空所有操作日志吗？')) {
                        fetch(prefix + '/clean', { method: 'POST' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.code === 0) {
                                    alert('清空成功');
                                    this.loadOperlogs();
                                } else {
                                    alert(data.msg || '清空失败');
                                }
                            });
                    }
                },
                
                exportOperlog() {
                    const params = new URLSearchParams();
                    Object.keys(this.searchParams).forEach(key => {
                        if (this.searchParams[key]) {
                            params.append(key, this.searchParams[key]);
                        }
                    });
                    window.location.href = prefix + '/export?' + params.toString();
                },
                
                prevPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        this.loadOperlogs();
                    }
                },
                
                nextPage() {
                    if (this.pageNum < this.totalPages) {
                        this.pageNum++;
                        this.loadOperlogs();
                    }
                },
                
                goToPage(page) {
                    this.pageNum = page;
                    this.loadOperlogs();
                }
            }
        }
    </script>
    
    <th:block th:include="include-new :: footer-new" />
</body>
</html>
